# Smoke real de la imagen única y del compose (C-12, tareas 7.1 a 7.5).
#
# El host de desarrollo no tiene virtualización habilitada y por eso no puede
# correr Docker. Este workflow ejecuta esas verificaciones en un runner con
# Docker y deja la evidencia versionada y repetible: build, usuario no-root,
# stack arriba, health, SPA same-origin, 404 JSON de la API, migraciones,
# seed del admin dentro de la imagen y fail-fast sin variables requeridas.
#
# Lo que NO cubre (sigue siendo deuda de C-12): 7.6 backups/restore en host,
# 7.7 deploy en PaaS y 7.8 TLS con proxy. Datos ficticios, sin secretos.
name: docker-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Preparar entorno ficticio (.env + .env.docker)
        run: |
          set -euo pipefail
          cp .env.example .env
          cp .env.docker.example .env.docker

      - name: 7.1 - Validar el compose (con y sin .env.docker)
        run: |
          set -euo pipefail
          docker compose config --quiet
          mv .env.docker .env.docker.bak
          docker compose config --quiet
          mv .env.docker.bak .env.docker

      - name: 7.2 - Build de la imagen y usuario no-root
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile -t turnos-web:smoke .
          docker run --rm --entrypoint id turnos-web:smoke | tee /tmp/id.txt
          grep -q "uid=10001" /tmp/id.txt

      - name: 7.3 - Stack arriba, healthy y DB no publicada
        run: |
          set -euo pipefail
          if ! docker compose up -d --wait --wait-timeout 300; then
            diagnostico=$(docker compose ps -a; docker compose logs --no-color --tail 60)
            echo "$diagnostico"
            echo "::error::el stack no llego a healthy: $(echo "$diagnostico" | tail -5 | tr '\n' '|')"
            exit 1
          fi
          docker compose ps
          # `docker compose port` sale 0 sin publicaciones en algunas versiones:
          # el binding real se lee del contenedor.
          bindings=$(docker compose ps -q db | xargs -r docker inspect --format '{{json .HostConfig.PortBindings}}')
          echo "db PortBindings: $bindings"
          if echo "$bindings" | grep -q '5432/tcp'; then
            echo "::error::la DB publica el 5432 al host: $bindings"
            exit 1
          fi

      - name: 7.4 - Health, SPA same-origin y 404 JSON de la API
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/api/health | grep -q '"status":"ok"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/)" = "200"
          curl -sS -o /dev/null -w '%{content_type}' http://localhost:8000/ | grep -q text/html
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/staff/agenda)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/api/ruta-inexistente)" = "404"
          curl -sS -o /dev/null -w '%{content_type}' http://localhost:8000/api/ruta-inexistente | grep -q application/json
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = "200"

      - name: Migraciones y seed del admin dentro de la imagen
        run: |
          set -euo pipefail
          docker compose run --rm web alembic upgrade head
          docker compose run --rm web alembic current | grep -q 002_agenda_meta
          docker compose run --rm web python scripts/seed_admin.py | tee /tmp/admin.txt
          grep -q "admin ok:" /tmp/admin.txt
          docker compose exec -T db psql -U turnos -d turnos -tAc "select 1" | grep -q 1

      - name: 7.5 - Fail-fast sin variables de entorno requeridas
        run: |
          set -euo pipefail
          set +e
          salida=$(docker run --rm turnos-web:smoke 2>&1)
          codigo=$?
          set -e
          echo "$salida"
          test "$codigo" -ne 0
          echo "$salida" | grep -q "Missing required env var"

      - name: Logs del stack si algo fallo
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Bajar el stack
        if: always()
        run: docker compose down -v --remove-orphans
