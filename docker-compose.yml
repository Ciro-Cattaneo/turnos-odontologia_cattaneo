# Turnos odontología (Cattaneo) — compose final v1 (C-12 D-1/D-11).
# Worker APScheduler EN-PROCESO (regla dura 6, PB-03): NO hay servicio worker
# ni Redis activos en v1; el camino de migración queda documentado al final.
# Build desde la raíz del repo (la imagen compila el frontend, D-2/D-3):
#   docker compose build web
#
# Variables: ambos servicios leen `.env` y, si existe, `.env.docker` (gana
# este último). `.env` es la config de la demo local (DB en localhost);
# `.env.docker` sobreescribe DATABASE_URL/POSTGRES_PASSWORD para la red del
# compose. Requiere Compose >= 2.24 (`env_file` con `required`).
#
# Orden de deploy (docs/deploy-single-host.md §4):
#   docker compose up -d db
#   docker compose run --rm web alembic upgrade head
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD llega por env_file: `.env.docker` gana sobre `.env`, así
    # que la password de `DATABASE_URL` y la del initdb son la misma y no se
    # duplican en el compose. `required: false` (Compose >= 2.24) permite el
    # flujo mínimo con sólo `.env` (ver docs/deploy-single-host.md §5).
    env_file:
      - path: .env
        required: true
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: turnos
      POSTGRES_DB: turnos
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - turnos-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
      # Overrides de docker (DATABASE_URL con host `db`, POSTGRES_PASSWORD,
      # FRONTEND_URL, worker). Gitignored; ver .env.docker y README §Docker.
      - path: .env.docker
        required: false
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${WEB_PORT:-8000}:8000"
    networks:
      - turnos-internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else sys.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  turnos-internal:
    driver: bridge

volumes:
  pgdata:

# --- Camino de migración (NO activo en v1) --------------------------------
# El worker de mail es el BackgroundScheduler in-proceso que arranca en el
# lifespan de `app.main`, módulo real `app.modules.notificaciones.scheduler`.
# Un proceso separado exigiría un entrypoint nuevo (hoy no existe) y poner
# NOTIF_WORKER_ENABLED=false en `web` para no correr el ciclo dos veces.
# worker:
#   build:
#     context: .
#     dockerfile: backend/Dockerfile
#   command: ["python", "-m", "app.modules.notificaciones.scheduler"]
#   depends_on:
#     db:
#       condition: service_healthy
#   env_file:
#     - .env
#
# Redis solo como variable documentada (REDIS_URL) si el worker migra a
# ARQ/Celery (PB-03): no se define el servicio `redis` en v1.
# REDIS_URL=redis://redis:6379/0
# redis:
#   image: redis:7-alpine
#   volumes:
#     - redisdata:/data
